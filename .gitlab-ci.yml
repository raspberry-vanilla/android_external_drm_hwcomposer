workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

variables:
  ANDROID_BRANCH: android16-release
  ANDROID_SDK_VERSION: 36
  DEBIAN_FRONTEND: noninteractive
  CI_TEMPLATES_COMMIT: &ci-templates-commit 32afe5644697e503af18a736587c8619fa036a72
  FDO_UPSTREAM_REPO: "drm-hwcomposer/drm-hwcomposer"
  CUTTLEFISH_TARBALL: "cuttlefish.tar.xz"
  RESULTS_DIR: "${CI_PROJECT_DIR}/results"

include:
  - project: 'freedesktop/ci-templates'
    ref: *ci-templates-commit
    file:
      - '/templates/debian.yml'
      - '/templates/ubuntu.yml'
  - local: '.ci/.gitlab-ci.yml'
  - local: '.ci/image-tags.yml'

stages:
  - container
  - build
  - tidy
  - style
  - android

build_arm64:
  stage: build
  extends:
    .use-ubuntu/x86_64_aospless
  script:
    .ci/build-arm64.sh
  artifacts:
    paths:
      - "${CI_PROJECT_DIR}/install/arm64"
    expire_in: 1 week

build_x86_64:
  stage: build
  extends:
    .use-ubuntu/x86_64_aospless
  script:
    "${CI_PROJECT_DIR}/.ci/build-x86_64.sh"
  artifacts:
    paths:
      - "${CI_PROJECT_DIR}/install/x86_64"
    expire_in: 1 week

tidy:
  stage: tidy
  extends:
    .use-ubuntu/x86_64_aospless
  script:
    - cp -r /aospless_arm64 ../aospless
    - make -j$(nproc) -k -f "${CI_PROJECT_DIR}/.ci/Makefile"

checkstyle:
  stage: style
  extends:
    .use-ubuntu/x86_64_aospless
  script: "./.ci/.gitlab-ci-checkcommit.sh"
  artifacts:
    when: on_failure
    untracked: true
  tags:
    - placeholder-job

android-cts:
  stage: android
  extends:
    .use-ubuntu/x86_64_android
  script:
    - "${CI_PROJECT_DIR}/.ci/android/cts-runner.sh"
  needs:
    - job: build_x86_64
      artifacts: true
    - job: ubuntu/x86_64_android
    - job: use-debian/x86_64_cuttlefish
      artifacts: true
  artifacts:
    paths:
      - "${RESULTS_DIR}"
    when: always
    expire_in: 1 week
  tags:
    - kvm

android-vts:
  stage: android
  extends:
    .use-ubuntu/x86_64_android
  script:
    - "${CI_PROJECT_DIR}/.ci/android/vts-runner.sh"
  needs:
    - job: build_x86_64
      artifacts: true
    - job: ubuntu/x86_64_android
    - job: use-debian/x86_64_cuttlefish
      artifacts: true
  artifacts:
    paths:
      - "${RESULTS_DIR}"
    when: always
    expire_in: 1 week
  tags:
    - kvm
